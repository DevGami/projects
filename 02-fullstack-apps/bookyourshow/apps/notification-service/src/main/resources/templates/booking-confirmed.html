<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking Confirmed</title>
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f13; color: #e2e8f0; }
    .wrapper { max-width: 600px; margin: 0 auto; padding: 32px 16px; }
    .card { background: #1a1a24; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
    .header { background: linear-gradient(135deg, #6c3de8, #3d3de8); padding: 32px; text-align: center; }
    .header h1 { margin: 0; font-size: 24px; color: #fff; }
    .header p { margin: 8px 0 0; color: rgba(255,255,255,0.8); font-size: 14px; }
    .body { padding: 32px; }
    .badge { display: inline-block; background: rgba(108,61,232,0.2); border: 1px solid rgba(108,61,232,0.4); color: #a78bfa; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 20px; }
    .movie-title { font-size: 22px; font-weight: 700; color: #fff; margin: 0 0 24px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .detail-item { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 14px; }
    .detail-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; margin-bottom: 4px; }
    .detail-value { font-size: 15px; font-weight: 600; color: #e2e8f0; }
    .divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 24px 0; }
    .total { display: flex; justify-content: space-between; align-items: center; }
    .total-label { font-size: 14px; color: #94a3b8; }
    .total-value { font-size: 22px; font-weight: 700; color: #a78bfa; }
    .cta-btn { display: block; text-align: center; background: linear-gradient(135deg, #6c3de8, #3d3de8); color: #fff; text-decoration: none; padding: 14px 32px; border-radius: 12px; font-weight: 600; font-size: 15px; margin: 24px 0 0; }
    .footer { padding: 20px 32px; text-align: center; font-size: 12px; color: #475569; border-top: 1px solid rgba(255,255,255,0.05); }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="card">
    <!-- Header -->
    <div class="header">
      <h1>🎬 Booking Confirmed!</h1>
      <p>Your seats are locked in. Enjoy the show!</p>
    </div>

    <!-- Body -->
    <div class="body">
      <span class="badge" th:text="'#' + ${bookingId}">BYS-XXXXXX</span>
      <p class="movie-title" th:text="${movieTitle}">Movie Title</p>

      <div class="detail-grid">
        <div class="detail-item">
          <div class="detail-label">Date</div>
          <div class="detail-value" th:text="${showDate}">DD MMM YYYY</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Time</div>
          <div class="detail-value" th:text="${showTime}">10:30 AM</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Theater</div>
          <div class="detail-value" th:text="${theater}">PVR Cinemas</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Screen</div>
          <div class="detail-value" th:text="${screen}">Screen 1</div>
        </div>
        <div class="detail-item" style="grid-column: 1 / -1;">
          <div class="detail-label">Address</div>
          <div class="detail-value" th:text="${city} + (${address} != null ? ', ' + ${address} : '')">City</div>
        </div>
      </div>

      <hr class="divider"/>
      <div class="total">
        <span class="total-label">Total Paid</span>
        <span class="total-value" th:text="'₹' + ${totalAmount}">₹0</span>
      </div>

      <a class="cta-btn" th:href="${frontendUrl} + '/bookings'">View My Bookings →</a>
    </div>

    <div class="footer">
      BookYourShow · Your seat is reserved. Please arrive 15 minutes early.
    </div>
  </div>
</div>
</body>
</html>
