<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Reset Your Password</title>
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f13; color: #e2e8f0; }
    .wrapper { max-width: 600px; margin: 0 auto; padding: 32px 16px; }
    .card { background: #1a1a24; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
    .header { background: linear-gradient(135deg, #dc2626, #b91c1c); padding: 32px; text-align: center; }
    .header h1 { margin: 0; font-size: 24px; color: #fff; }
    .header p { margin: 8px 0 0; color: rgba(255,255,255,0.8); }
    .body { padding: 32px; text-align: center; }
    .message { color: #94a3b8; line-height: 1.7; margin-bottom: 28px; }
    .cta-btn { display: inline-block; background: linear-gradient(135deg, #6c3de8, #3d3de8); color: #fff; text-decoration: none; padding: 14px 36px; border-radius: 12px; font-weight: 600; font-size: 15px; }
    .warning { margin-top: 24px; padding: 14px; background: rgba(220,38,38,0.1); border: 1px solid rgba(220,38,38,0.3); border-radius: 10px; font-size: 13px; color: #fca5a5; }
    .footer { padding: 20px 32px; text-align: center; font-size: 12px; color: #475569; border-top: 1px solid rgba(255,255,255,0.05); }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="card">
    <div class="header">
      <h1>🔐 Password Reset</h1>
      <p>We received a request to reset your password</p>
    </div>
    <div class="body">
      <p class="message">
        Click the button below to reset your password. 
        This link expires in <strong>1 hour</strong>.
      </p>
      <a class="cta-btn" th:href="${resetLink}">Reset My Password →</a>
      <div class="warning">
        If you didn't request this, you can safely ignore this email. 
        Your password won't change.
      </div>
    </div>
    <div class="footer">
      BookYourShow · <span th:text="${email}">you@example.com</span>
    </div>
  </div>
</div>
</body>
</html>
