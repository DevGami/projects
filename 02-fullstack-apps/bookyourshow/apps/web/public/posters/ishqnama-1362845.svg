<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750" viewBox="0 0 500 750">
  <defs>
    <linearGradient id="bg_ishqnama-1362845" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75" />
      <stop offset="45%" stop-color="#4a044e" />
      <stop offset="100%" stop-color="#1f0122" />
    </linearGradient>
    <radialGradient id="glow_ishqnama-1362845" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="top_shade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85" />
      <stop offset="25%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow_ishqnama-1362845" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background layers -->
  <rect width="500" height="750" fill="url(#bg_ishqnama-1362845)" />
  <rect width="500" height="750" fill="url(#glow_ishqnama-1362845)" />

  <!-- Outer Cinema Border -->
  <rect x="18" y="18" width="464" height="714" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.4" rx="12" />
  <rect x="26" y="26" width="448" height="698" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.1" rx="8" />

  <!-- Corner Brackets -->
  <path d="M 18 52 L 18 18 L 52 18" fill="none" stroke="#f43f5e" stroke-width="3" />
  <path d="M 482 52 L 482 18 L 448 18" fill="none" stroke="#f43f5e" stroke-width="3" />
  <path d="M 18 698 L 18 732 L 52 732" fill="none" stroke="#f43f5e" stroke-width="3" />
  <path d="M 482 698 L 482 732 L 448 732" fill="none" stroke="#f43f5e" stroke-width="3" />

  <!-- Center Emblem Art -->
  <circle cx="250" cy="310" r="115" fill="none" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.25" />
  <circle cx="250" cy="310" r="95" fill="#701a75" fill-opacity="0.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" />
  <circle cx="250" cy="310" r="75" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.6" />
  
  <text x="250" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#fbcfe8" letter-spacing="4" filter="url(#shadow_ishqnama-1362845)">ISH</text>

  <!-- Atmospheric Shadow Overlay -->
  <rect width="500" height="750" fill="url(#top_shade)" />

  <!-- Header: Genre & Release Year -->
  <text x="250" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fbcfe8" letter-spacing="3">ROMANCE • PERIOD • DRAMA</text>
  <text x="250" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="2">IN THEATRES 2026</text>

  <!-- Star Cast Header -->
  <text x="250" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#f1f5f9" letter-spacing="1.5" filter="url(#shadow_ishqnama-1362845)">JAYY RANDHAWA • SHEHNAAZ GILL • GUGGU GILL</text>

  <!-- Tagline Above Title -->
  <text x="250" y="495" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#fbcfe8" letter-spacing="2" filter="url(#shadow_ishqnama-1362845)">A BORDERLESS LOVE STORY</text>

  <!-- Movie Title -->
  <text x="250" y="540" text-anchor="middle" font-family="system-ui, -apple-system, Impact, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="2" filter="url(#shadow_ishqnama-1362845)">ISHQNAMA</text>

  <!-- Accent Divider -->
  <line x1="160" y1="562" x2="340" y2="562" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />

