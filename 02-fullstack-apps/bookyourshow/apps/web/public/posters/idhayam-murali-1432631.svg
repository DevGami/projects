<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="60%" stop-color="#500724"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>
  <circle cx="300" cy="360" r="260" fill="url(#glow)"/>

  <!-- Top Badges -->
  <rect x="40" y="40" width="70" height="28" rx="6" fill="#0f172a" stroke="#f472b6" stroke-width="1.5"/>
  <text x="75" y="59" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">U</text>

  <rect x="440" y="40" width="120" height="28" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="500" y="59" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">TAMIL</text>

  <!-- Center Decorative Visual -->
  <g transform="translate(300, 360)">
    <circle r="120" fill="none" stroke="#f472b6" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="10 15"/>
    <circle r="90" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2"/>
    <text y="30" font-family="'Impact', 'Segoe UI', sans-serif" font-size="90" font-weight="900" fill="url(#accentG)" text-anchor="middle" letter-spacing="4">I</text>
  </g>

  <!-- Bottom Title Block -->
  <g transform="translate(300, 680)">
    <text y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">IDHAYAM MURALI</text>
    <text y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f472b6" text-anchor="middle" letter-spacing="3">A HEARTFELT MUSICAL ODYSSEY</text>
    
    <line x1="-180" y1="65" x2="180" y2="65" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    
    <text y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="1.5">ATHARVAA • ANUPAMA PARAMESWARAN</text>
    <text y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="4">IN THEATRES NOW • BOOK YOUR SHOW</text>
  </g>
</svg>