<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750" viewBox="0 0 500 750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f1629;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e1f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="reel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="750" fill="url(#bg)"/>
  <rect width="500" height="750" fill="url(#shine)"/>

  <!-- Decorative film strip lines top -->
  <rect x="0" y="0" width="500" height="55" fill="#0d1220" opacity="0.8"/>
  <rect x="0" y="55" width="500" height="3" fill="#1e3a5f" opacity="0.6"/>
  <circle cx="30" cy="27" r="12" fill="#1e3a5f" opacity="0.7"/>
  <circle cx="80" cy="27" r="12" fill="#1e3a5f" opacity="0.7"/>
  <circle cx="130" cy="27" r="12" fill="#1e3a5f" opacity="0.7"/>
  <circle cx="370" cy="27" r="12" fill="#1e3a5f" opacity="0.7"/>
  <circle cx="420" cy="27" r="12" fill="#1e3a5f" opacity="0.7"/>
  <circle cx="470" cy="27" r="12" fill="#1e3a5f" opacity="0.7"/>

  <!-- Film strip lines bottom -->
  <rect x="0" y="695" width="500" height="55" fill="#0d1220" opacity="0.8"/>
  <rect x="0" y="692" width="500" height="3" fill="#1e3a5f" opacity="0.6"/>
  <circle cx="30" cy="722" r="12" fill="#1e3a5f" opacity="0.7"/>
  <circle cx="80" cy="722" r="12" fill="#1e3a5f" opacity="0.7"/>
  <circle cx="130" cy="722" r="12" fill="#1e3a5f" opacity="0.7"/>
  <circle cx="370" cy="722" r="12" fill="#1e3a5f" opacity="0.7"/>
  <circle cx="420" cy="722" r="12" fill="#1e3a5f" opacity="0.7"/>
  <circle cx="470" cy="722" r="12" fill="#1e3a5f" opacity="0.7"/>

  <!-- Central film reel icon -->
  <circle cx="250" cy="350" r="120" fill="none" stroke="#1e3a5f" stroke-width="3" opacity="0.6"/>
  <circle cx="250" cy="350" r="85" fill="url(#reel)" opacity="0.5"/>
  <circle cx="250" cy="350" r="85" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
  <circle cx="250" cy="350" r="22" fill="#1e3a5f" opacity="0.9"/>
  <circle cx="250" cy="350" r="22" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <circle cx="250" cy="350" r="8" fill="#3b82f6" opacity="0.6"/>

  <!-- Spokes -->
  <line x1="250" y1="265" x2="250" y2="328" stroke="#3b82f6" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <line x1="250" y1="372" x2="250" y2="435" stroke="#3b82f6" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <line x1="165" y1="350" x2="228" y2="350" stroke="#3b82f6" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <line x1="272" y1="350" x2="335" y2="350" stroke="#3b82f6" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <line x1="189" y1="274" x2="234" y2="330" stroke="#3b82f6" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <line x1="266" y1="370" x2="311" y2="426" stroke="#3b82f6" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <line x1="311" y1="274" x2="266" y2="330" stroke="#3b82f6" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <line x1="189" y1="426" x2="234" y2="370" stroke="#3b82f6" stroke-width="3" opacity="0.4" stroke-linecap="round"/>

  <!-- "No Image" text -->
  <text x="250" y="530" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#475569" letter-spacing="2">NO POSTER AVAILABLE</text>

  <!-- Subtle corner accents -->
  <line x1="0" y1="58" x2="0" y2="692" stroke="#1e3a5f" stroke-width="2" opacity="0.5"/>
  <line x1="500" y1="58" x2="500" y2="692" stroke="#1e3a5f" stroke-width="2" opacity="0.5"/>
</svg>
