# BookYourShow — Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
# Requires: .env.prod file with all secrets

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: bys-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - bys_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [bys-net]

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:8.0
    container_name: bys-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - bys_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [bys-net]

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bys-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - bys_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [bys-net]

  # ── Kafka ───────────────────────────────────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    container_name: bys-kafka
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    volumes:
      - bys_kafkadata:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks: [bys-net]

  # ── API (Node.js) ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: bys-api
    env_file: .env.prod
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [bys-net]

  # ── Frontend (Next.js) ──────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: bys-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api
    restart: unless-stopped
    networks: [bys-net]

  # ── RAG AI Service (Python) ─────────────────────────────────────────────────
  rag:
    build:
      context: ./apps/rag-service
      dockerfile: Dockerfile
    container_name: bys-rag
    env_file: .env.prod
    volumes:
      - bys_faissdata:/app/faiss_store
    depends_on:
      - mongodb
    restart: unless-stopped
    networks: [bys-net]

  # ── Notification Service (Java) ─────────────────────────────────────────────
  notification:
    build:
      context: ./apps/notification-service
      dockerfile: Dockerfile
    container_name: bys-notification
    env_file: .env.prod
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks: [bys-net]

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bys-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
      - rag
    restart: unless-stopped
    networks: [bys-net]

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  bys_pgdata:
  bys_mongodata:
  bys_redisdata:
  bys_kafkadata:
  bys_faissdata:

# ── Network ──────────────────────────────────────────────────────────────────
networks:
  bys-net:
    driver: bridge
